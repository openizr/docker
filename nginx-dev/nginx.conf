load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

# Main context: worker crashes and `setrlimit` failures go here, not to the `http` log.
error_log /dev/stderr info;

include /var/lib/nginx/generated/tuning.conf;

# Two descriptors per proxied connection, with no `open_file_cache` here.
worker_rlimit_nofile 32768;

# Not /tmp: world-writable.
pid /var/lib/nginx/run/nginx.pid;

# `multi_accept` is left off (the default): it worsens imbalance between workers.

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # We need to map these types to the correct MIME types as nginx doesn't map them by default.
  types {
    text/javascript            mjs cjs;
    text/markdown              md;
    font/ttf                   ttf;
    font/otf                   otf;
    application/manifest+json  webmanifest;
  }

  # Here rather than per server, so it also covers responses generated before a server
  # block is selected.
  server_tokens off;

  # Self-issued redirects must not leak the internal listener when the public port differs.
  absolute_redirect off;
  port_in_redirect off;

  # /var/cache/nginx belongs to root. nginx creates every configured temp path at
  # start-up, so all five must move or it exits on the first one it cannot mkdir.
  client_body_temp_path /var/lib/nginx/tmp/client  1 2;
  proxy_temp_path       /var/lib/nginx/tmp/proxy   1 2;
  fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi 1 2;
  uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi   1 2;
  scgi_temp_path        /var/lib/nginx/tmp/scgi    1 2;

  # Logging.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time urt=$upstream_response_time';

  # Buffered: unbuffered is one synchronous write per request.
  access_log /dev/stdout main buffer=32k flush=5s;
  error_log  /dev/stderr info;

  # Connection handling. `sendfile` off: with a bind mount it can serve stale bytes.
  sendfile off;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  reset_timedout_connection on;

  # Slowloris mitigation: the defaults are 60s each.
  client_header_timeout 15s;
  client_body_timeout   15s;
  send_timeout          15s;

  # No `open_file_cache`: it would hide an edited file for up to its `_valid`.

  # `gzip_vary` stops a shared cache serving one encoding to a client that asked for
  # another. `gzip_proxied any` matters behind a load balancer, which adds `Via`; the
  # default would skip compression for every such request.
  #
  # The two type lists cannot be shared, so keep them in step, and mirror additions in
  # `bin/precompress-assets`.
  gzip on;
  gzip_static off;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 3;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    text/markdown
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/manifest+json
    application/wasm
    application/vnd.ms-fontobject
    image/svg+xml
    image/vnd.microsoft.icon
    image/x-icon
    font/ttf
    font/otf;

  # No `brotli_vary`: ngx_brotli defines none and nginx refuses to start on it.
  # `Vary: Accept-Encoding` comes from `gzip_vary` above.
  brotli on;
  brotli_static off;
  brotli_comp_level 4;
  brotli_min_length 1024;
  brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    text/markdown
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/manifest+json
    application/wasm
    application/vnd.ms-fontobject
    image/svg+xml
    image/vnd.microsoft.icon
    image/x-icon
    font/ttf
    font/otf;

  # Server configuration.
  include /var/lib/nginx/generated/80.conf;
}
