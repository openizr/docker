# Operator extension point, included at the end of the generated `server` block.
#
# Valid here: `location`, and server-context directives such as `client_max_body_size`
# or `root`. NOT valid: http-only directives (`limit_req_zone`, `proxy_cache_path`,
# `map`, `upstream`) or another `server` block -- nginx will refuse to start.
#
# To replace the whole server block, use a custom template:
#
#   COPY my-nginx.conf /etc/nginx/nginx.conf                     # http context
#   COPY my-80.conf.template /etc/nginx/templates/dynamic/       # the whole server
#
# `add_header` at a level replaces everything inherited, so re-include the snippet:
#
#   location /example {
#     include /var/lib/nginx/generated/snippets/security-headers.conf;
#     add_header 'X-Example' 'value' always;
#   }
#
# Do not enable `proxy_intercept_errors` in dynamic mode: the pre-renderer is selected by
# an internal 418, and a genuine 418 from the back end would then be routed to it.

